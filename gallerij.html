<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogalerij Archief | Brecht Transport B.V.</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #110202;
            --bg-card: rgba(51, 0, 0, 0.45);
            --primary-light: #cc0000;
            --accent-red: #ff3333;
            --border-red: rgba(204, 0, 0, 0.25);
            --text-main: #ffffff;
            --text-muted: #d0b8b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; }

        nav {
            position: sticky; top: 10px; z-index: 1000; margin: 0 auto 30px auto; max-width: 1200px; width: 95%;
            background: rgba(35, 3, 3, 0.85); backdrop-filter: blur(16px);
            border: 1px solid var(--border-red); border-radius: 20px; padding: 12px 24px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .brand-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: white; }
        .logo-badge { width: 40px; height: 40px; background: linear-gradient(135deg, #cc0000, #330000); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; border: 1px solid rgba(255,255,255,0.2); }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
        .gallery-card { background: var(--bg-card); border: 1px solid var(--border-red); border-radius: 18px; padding: 12px; overflow: hidden; transition: transform 0.3s; cursor: pointer; }
        .gallery-card:hover { transform: translateY(-5px); border-color: var(--accent-red); }
        .gallery-img { width: 100%; height: 220px; object-fit: cover; border-radius: 12px; }
        .gallery-meta { display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.85rem; color: var(--text-muted); }

        .search-bar { width: 100%; max-width: 400px; padding: 12px 18px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-red); color: white; border-radius: 10px; margin-top: 15px; }

        #lightbox-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.92); z-index:3000; justify-content:center; align-items:center; flex-direction:column; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="brand-logo">
            <div class="logo-badge">B</div>
            <div style="font-family:'Space Grotesk', sans-serif; font-weight:700;">BRECHT TRANSPORT B.V.</div>
        </a>
        <div>
            <a href="index.html" style="color:var(--text-muted); text-decoration:none; font-weight:bold; margin-right:20px;">← Terug naar Hoofdsite</a>
            <a href="portaal.html" style="background:var(--primary-light); color:white; padding:8px 16px; border-radius:10px; text-decoration:none; font-weight:bold;"><i class="fa-solid fa-lock"></i> Portaal</a>
        </div>
    </nav>

    <div class="container">
        <h1 style="font-family:'Space Grotesk', sans-serif; color:#fff; font-size:2.5rem;">Fotogalerij Archief</h1>
        <p style="color:var(--text-muted); margin-top:5px;">Alle foto's geüpload door onze chauffeurs onderweg</p>

        <input type="text" id="search-input" onkeyup="filterPhotos()" placeholder="Zoek op chauffeur (bijv. MJGamerNL)..." class="search-bar">

        <div class="gallery-grid" id="full-gallery-container"></div>
    </div>

    <!-- LIGHTBOX -->
    <div id="lightbox-modal">
        <span onclick="closeLightbox()" style="position:absolute; top:25px; right:35px; color:#fff; font-size:2.5rem; cursor:pointer;">&times;</span>
        <img id="lightbox-img" src="" style="max-width:90%; max-height:80vh; border-radius:12px; border:2px solid var(--border-red);">
        <div id="lightbox-caption" style="margin-top:15px; color:var(--text-muted); font-size:1.1rem; text-align:center;"></div>
    </div>

    <script>
        let allPhotos = [];

        async function loadAllPhotos() {
            try {
                const res = await fetch('https://haulmpbrecht.onrender.com/api/haulmp');
                const data = await res.json();
                allPhotos = data.gallery || [];
                renderPhotos(allPhotos);
            } catch (err) {
                console.log('Fout bij laden foto-archief');
            }
        }

        function renderPhotos(photos) {
            const container = document.getElementById('full-gallery-container');
            container.innerHTML = '';

            if (photos.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted);">Geen foto\'s gevonden.</p>';
                return;
            }

            photos.forEach((p) => {
                container.insertAdjacentHTML('beforeend', `
                    <div class="gallery-card" onclick="openLightbox('${p.url}', '${p.uploadedBy}', '${p.date || 'Recent'}')">
                        <img src="${p.url}" class="gallery-img">
                        <div class="gallery-meta">
                            <span><i class="fa-solid fa-camera"></i> ${p.uploadedBy}</span>
                            <span>${p.date || 'Recent'}</span>
                        </div>
                    </div>
                `);
            });
        }

        function filterPhotos() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allPhotos.filter(p => p.uploadedBy.toLowerCase().includes(query));
            renderPhotos(filtered);
        }

        function openLightbox(url, author, date) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox-caption').innerHTML = `<i class="fa-solid fa-camera"></i> Gemaakt door <b>${author}</b> op ${date}`;
            document.getElementById('lightbox-modal').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox-modal').style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', loadAllPhotos);
    </script>
</body>
</html>
